# Rencana eksperimen tim 14: Deteksi anomali suara mesin
# Label: Desain: gangguan yang dibuat operator; normal = data bersama

tim: 14
judul: Deteksi anomali suara mesin
pembimbing: Ardika Satria
pilar: Suara
seed: 1014
ulangan: 5
durasi_kondisi_detik: 6
jeda_detik: 0.5

rekam:
  audio:
    aktif: true
    sample_rate: 16000
  kamera:
    aktif: false

harian:
  mulai: 2026-11-11
  jumlah_hari: 4
  file_per_hari: 6

faktor:
  gangguan:
    jenis: isyarat
    taraf:
      - normal
      - kertas menyentuh baling kipas
      - benda logam jatuh di meja
      - ujung selang pompa terangkat dari air
    instruksi: 'Lakukan: {taraf}'
  kipas:
    - 120
    - 220
  pompa:
    - 0
    - 200

bahan:
  - Karton tipis sekitar 2 x 10 cm
  - Sendok logam
  - Penggaris 30 cm
  - Spidol atau penanda
  - Lakban kertas
  - Gunting atau cutter
  - Kipas sesuai slot
  - Pompa dan wadah air
  - Laptop dengan perekam audio 16 kHz
  - Timer
  - Kabel listrik panjang (opsional)

persiapan:
  - Memotong karton tipis sekitar 2 x 10 cm.
  - Menandai titik jatuh sendok logam.
  - Menandai ketinggian 10 cm dari titik jatuh dengan penggaris.
  - Memastikan kipas dan pompa menyala sesuai kondisi sebelum merekam.

metode:
  jenis_tugas: Deteksi anomali
  masukan_model: Log-mel 64 pita, 1 s
  metrik_utama: AUROC
  jalur:
    - CNN
    - TL
    - Transformer
    - AE
  pembanding_non_dl: Isolation Forest pada MFCC
  catatan_metode: AE jalur utama (latih hanya data normal)
